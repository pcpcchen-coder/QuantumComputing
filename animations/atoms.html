<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離子阱與中性原子量子電腦 3D</title>
<link rel="stylesheet" href="css/style.css">
<style>/* 外部 css 載入失敗時仍維持深色底，並顯示啟動錯誤 */
html,body{background:#070c16;color:#e8eef8}
#boot-error{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;background:#070c16;color:#e8eef8;
  font:15px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;text-align:center}
#boot-error[hidden]{display:none}
#boot-error div{max-width:640px}
#boot-error a{color:#8ef0ff;word-break:break-all}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header id="topbar">
  <div class="brand">離子阱與中性原子量子電腦 <span>系統 · 量子位元 · 操作 · 量測</span></div>
  <nav id="scene-nav" aria-label="場景"></nav>
</header>

<aside id="panel">
  <div class="scene-num" id="scene-num"></div>
  <h1 id="scene-title"></h1>
  <div class="scene-sub" id="scene-sub"></div>
  <div class="scene-desc" id="scene-desc"></div>
  <div class="controls" id="controls"></div>
  <div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵/Shift 拖曳平移<br>← → 切換場景 · 空白鍵 暫停 · H 隱藏面板 · F 全螢幕 · R 重設視角<br>超導量子電腦：<a href="index.html" style="color:#8ef0ff">index.html</a>（JJ 與讀取）、<a href="peripherals.html" style="color:#8ef0ff">peripherals.html</a>（周邊系統）、<a href="operation.html" style="color:#8ef0ff">operation.html</a>（操作）</div>
</aside>

<div id="inset-wrap"><div id="inset-title"></div><canvas id="inset" width="380" height="230"></canvas></div>
<div id="paused-badge">⏸ 暫停中</div>

<script src="lib/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/peripherals/common.js"></script>
<script src="js/atoms/common.js"></script>
<script src="js/atoms/01_ionsys.js"></script>
<script src="js/atoms/02_paul.js"></script>
<script src="js/atoms/03_ionqubit.js"></script>
<script src="js/atoms/04_modes.js"></script>
<script src="js/atoms/05_ms.js"></script>
<script src="js/atoms/06_qccd.js"></script>
<script src="js/atoms/07_atomsys.js"></script>
<script src="js/atoms/08_tweezer.js"></script>
<script src="js/atoms/09_atomqubit.js"></script>
<script src="js/atoms/10_rydberg.js"></script>
<script src="js/atoms/11_zoned.js"></script>
<script src="js/atoms/12_imaging.js"></script>
<script src="js/atoms/13_compare.js"></script>
<div id="boot-error" hidden><div id="boot-error-msg"></div></div>
<script>
// 啟動檢查：缺檔或無法使用 WebGL 時顯示原因，而不是一片空白
(function () {
  var box = document.getElementById('boot-error'), msg = document.getElementById('boot-error-msg');
  var page = location.pathname.split('/').pop() || 'index.html';
  var online = 'https://pcpcchen-coder.github.io/QuantumComputing/animations/' + page + location.hash;
  function fail(text) {
    msg.innerHTML = text + (location.href.indexOf(online.split('#')[0]) === 0 ? '' :
      '<br><br>也可以直接開啟線上版：<br><a href="' + online + '">' + online + '</a>');
    box.hidden = false;
  }
  if (typeof THREE === 'undefined' || typeof App === 'undefined') {
    fail('找不到動畫需要的程式檔（<b>css/</b>、<b>js/</b>、<b>lib/</b> 資料夾）。<br>' +
         '請下載整個 <b>animations</b> 資料夾後再開啟這個 HTML，不要只下載單一檔案，' +
         '也不要在 GitHub 網頁、雲端硬碟或通訊軟體的預覽裡開啟。');
    return;
  }
  try { App.start(); } catch (err) {
    fail(/WebGL/i.test(String(err && err.message)) ?
      '這個瀏覽器無法啟用 WebGL，所以 3D 場景無法顯示。<br>請改用桌面版 Chrome、Edge、Safari 或 Firefox，並確認已開啟「硬體加速」。' :
      '動畫啟動失敗：' + (err && err.message));
  }
})();
</script>
</body>
</html>

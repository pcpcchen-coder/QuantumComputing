<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1,000 位元供電設計</title>
<style>
:root{
  --bg:#070c16; --panel:rgba(12,20,36,.9); --line:rgba(140,170,220,.22);
  --text:#e8eef8; --muted:#9fb0c8; --gold:#e0a54a; --teal:#38c6d9;
  --red:#ff5a5f; --green:#3ccf8e; --purple:#9d8cff; --blue:#4f8cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","WenQuanYi Zen Hei",system-ui,sans-serif}
#topbar{position:fixed;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:18px;
  padding:10px 16px;background:linear-gradient(180deg,rgba(5,9,18,.97),rgba(5,9,18,.6));z-index:5}
.brand{font-weight:700;font-size:16px;color:var(--gold);white-space:nowrap}
.brand span{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
#scene-nav{display:flex;gap:6px;flex-wrap:wrap}
#scene-nav button{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line);
  border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}
#scene-nav button:hover{color:var(--text);border-color:rgba(224,165,74,.6)}
#scene-nav button.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
#panel{position:fixed;left:16px;top:70px;width:370px;bottom:16px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;z-index:4}
.scene-num{color:var(--teal);font-size:13px;letter-spacing:.08em}
#panel h1{font-size:22px;margin:4px 0 4px;color:#fff}
.scene-sub{color:var(--gold);font-size:14px;margin-bottom:10px}
.scene-desc{font-size:14px;line-height:1.7;color:#d3dcea}
.scene-desc p{margin:0 0 8px}
.scene-desc b{color:#fff}
.scene-desc .src{font-size:12px;color:var(--muted)}
.controls{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}
.ctl label b{color:var(--text);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--gold)}
.ctl select{width:100%;background:#0d1a2c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px;font-family:inherit;font-size:13px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:#d3dcea;cursor:pointer}
.tog input{accent-color:var(--gold);width:16px;height:16px}
.metrics{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.metrics .k{color:var(--muted)}
.metrics .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.v.ok{color:var(--green)} .v.warn{color:var(--gold)} .v.bad{color:var(--red)} .v.info{color:var(--teal)}
.hint{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
#stage{position:fixed;left:400px;right:12px;top:66px;bottom:10px}
#stage svg{width:100%;height:100%;display:block}
#paused{position:fixed;right:20px;top:72px;background:rgba(224,165,74,.9);color:#1a1206;padding:4px 10px;border-radius:10px;font-size:13px;display:none;z-index:6}
body.hide-ui #panel{display:none}
body.hide-ui #stage{left:12px}
svg text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","WenQuanYi Zen Hei",sans-serif}
.pp{cursor:pointer}
@media (max-width:900px){#panel{width:auto;right:16px;bottom:auto;max-height:45vh}#stage{left:12px;top:50vh}}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">1,000 位元超導系統供電設計 <span>痛點與需求互動動畫</span></div>
  <nav id="scene-nav" aria-label="場景"></nav>
</header>
<aside id="panel">
  <div class="scene-num" id="scene-num"></div>
  <h1 id="scene-title"></h1>
  <div class="scene-sub" id="scene-sub"></div>
  <div class="scene-desc" id="scene-desc"></div>
  <div class="controls" id="controls"></div>
  <div class="metrics" id="metrics"></div>
  <div class="hint">← → 切換場景 · 空白鍵 暫停 · H 隱藏面板 · F 全螢幕<br>網址加 <b>#場景代號</b> 可直接跳轉；加 <b>?noui=1</b> 以無面板模式開啟<br>標示「推論」「示意」者為估算或教學示意，非廠商實際數據</div>
</aside>
<div id="stage"><svg id="svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="paused">⏸ 暫停中</div>

<script>
'use strict';
// ───────────────────────── 共用模型（與 docs/1000量子位元系統供電設計.md 相同假設）─────────────────────────
const PER_LINE = { // Krinner et al., EPJ QT 6, 2 (2019) Table 2（每條線被動熱負載，W）
  drive: { s50: 45e-3, s4: 1.0e-3, still: 4e-6, cp: 0.4e-6, mxc: 0.013e-6 },
  flux:  { s50: 56e-3, s4: 1.2e-3, still: 2e-6, cp: 0.29e-6, mxc: 0.025e-6 },
  out:   { s50: 45e-3, s4: 1.0e-3, still: 4e-6, cp: 0.29e-6, mxc: 0.020e-6 },
};
const CAP = { s50: 52.5, s4: 1.9, still: 40e-3, cp: 0.2e-3, mxc: 30e-6 }; // 每支脈衝管／每個稀釋單元
function lines(N, cryo) {
  const C = Math.round(1.5 * N), fl = Math.ceil(N / 8);
  const xy = cryo ? Math.ceil(N / 16) : N;
  const flux = cryo ? Math.ceil((N + C) / 16) : N + C;
  return { N, C, fl, xy, flux, ri: fl, ro: fl, pump: fl, total: xy + flux + 3 * fl,
           dc: (cryo ? 0 : N + C) + 3 * fl };
}
function heat(L, o) { // o: {thin, nbti, cryo, N}
  const k = o.thin ? 0.27 : 1, st = ['s50', 's4', 'still', 'cp', 'mxc'], r = {};
  const drv = L.xy + L.ri + L.pump;
  st.forEach(s => {
    const fluxPer = (o.nbti && (s === 'cp' || s === 'mxc')) ? PER_LINE.out[s] : PER_LINE.flux[s];
    r[s] = k * (drv * PER_LINE.drive[s] + L.flux * fluxPer + L.ro * PER_LINE.out[s]);
  });
  r.s4 += L.fl * 1e-3;                       // HEMT 約 1 mW（中間值）
  if (o.cryo) r.s4 += o.N * 1.5e-3;          // 低溫 CMOS 每位元 1.5 mW（假設）
  r.cp += L.pump * 0.23e-6;                  // TWPA 泵浦主動負載
  r.fluxDC = o.nbti ? 0 : L.flux * 0.050e-6 * (o.thin ? 4 : 1); // 磁通直流（±1 mA 隨機）
  return r;
}
const fmtW = w => w >= 1 ? w.toFixed(w >= 100 ? 0 : 1) + ' W' : w >= 1e-3 ? (w * 1e3).toFixed(w >= 0.1 ? 0 : 1) + ' mW' : (w * 1e6).toFixed(w >= 1e-4 ? 0 : 1) + ' µW';
const fmtN = n => n.toLocaleString('en-US');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ───────────────────────── SVG 小工具 ─────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
function el(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e); return e;
}
function txt(x, y, s, o = {}, parent = svg) {
  return el('text', { x, y, fill: o.fill || '#e8eef8', 'font-size': o.size || 14, 'font-weight': o.bold ? 700 : 400,
    'text-anchor': o.anchor || 'start', 'dominant-baseline': o.base || 'middle', opacity: o.op ?? 1 }, parent, s);
}
function box(x, y, w, h, o = {}, parent = svg) {
  return el('rect', { x, y, width: w, height: h, rx: o.rx ?? 10, fill: o.fill || 'rgba(255,255,255,.04)',
    stroke: o.stroke || 'rgba(140,170,220,.35)', 'stroke-width': o.sw || 1.5 }, parent);
}
// 沿路徑流動的粒子
class Flow {
  constructor(d, color, rate, parent = svg, width = 3) {
    this.path = el('path', { d, fill: 'none', stroke: color, 'stroke-opacity': .25, 'stroke-width': width }, parent);
    this.layer = el('g', {}, parent);
    this.len = this.path.getTotalLength(); this.color = color; this.rate = rate; this.dots = []; this.acc = 0; this.parent = this.layer; this.on = true;
  }
  tick(dt) {
    if (this.on) { this.acc += dt * this.rate; while (this.acc > 1) { this.acc -= 1; this.dots.push({ s: 0, e: el('circle', { r: 3.2, fill: this.color }, this.parent) }); } }
    const sp = 140 * dt;
    this.dots = this.dots.filter(d => { d.s += sp; if (d.s > this.len) { d.e.remove(); return false; }
      const p = this.path.getPointAtLength(d.s); d.e.setAttribute('cx', p.x); d.e.setAttribute('cy', p.y); return true; });
  }
}

// ───────────────────────── 面板控制 ─────────────────────────
const $ = id => document.getElementById(id);
const ctlBox = $('controls'), metBox = $('metrics');
function slider(label, min, max, step, val, fmt, cb) {
  const d = document.createElement('div'); d.className = 'ctl';
  d.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
  const b = d.querySelector('b'), i = d.querySelector('input');
  const upd = () => { b.textContent = fmt(+i.value); cb(+i.value); };
  i.addEventListener('input', upd); ctlBox.appendChild(d); b.textContent = fmt(val); return i;
}
function toggle(label, val, cb) {
  const d = document.createElement('label'); d.className = 'tog';
  d.innerHTML = `<input type="checkbox" ${val ? 'checked' : ''}><span>${label}</span>`;
  const i = d.querySelector('input'); i.addEventListener('change', () => cb(i.checked)); ctlBox.appendChild(d); return i;
}
function select(label, opts, val, cb) {
  const d = document.createElement('div'); d.className = 'ctl';
  d.innerHTML = `<label><span>${label}</span></label><select>${opts.map(([v, t]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const s = d.querySelector('select'); s.addEventListener('change', () => cb(s.value)); ctlBox.appendChild(d); return s;
}
function metrics(rows) {
  metBox.innerHTML = rows.map(([k, v, c]) => `<div class="k">${k}</div><div class="v ${c || ''}">${v}</div>`).join('');
}

// ───────────────────────── 場景 ─────────────────────────
const SCENES = [];
const S = o => SCENES.push(o);

// 1. 全景：電從哪裡來、到哪裡去
S({ id: 'overview', title: '全景：電從哪裡來、到哪裡去', sub: '推論：1,000 位元設施約 80–320 kW（中點合計約 200 kW）',
  desc: `<p>從中壓進線到稀釋冷凍機，電要經過<b>分層 UPS</b>，再分成三條匯流排：<b>機電</b>（壓縮機、冷卻水、GHS）、<b>乾淨</b>（控制電子、精密直流、時脈）、<b>運算</b>（即時解碼）。</p>
  <p>粒子密度代表功率。紅色編號是痛點，<b>點擊</b>可看說明。勾選「模擬斷電」觀察哪些負載能撐住。</p>
  <p class="src">負載數字：本 repo 設計文件第 4 章（推論）；壓縮機 12.5 kW（PT420 規格）。</p>`,
  build(st) {
    st.outage = false; st.ups = { cool: true, ctrl: true, comp: true }; st.sel = null;
    const g = el('g', {});
    const N = [ // 節點
      ['grid', 40, 330, 130, 80, '中壓進線', '雙迴路＋發電機'],
      ['ups', 230, 330, 140, 80, '分層 UPS', '80–270 kW'],
      ['mech', 450, 120, 200, 90, '機電匯流排', '約 80 kW'],
      ['clean', 450, 330, 200, 90, '乾淨匯流排', '約 70 kW'],
      ['comp', 450, 540, 200, 90, '運算匯流排', '約 30 kW'],
    ];
    const loads = [
      ['comp1', 730, 40, '壓縮機 ×3–5', '37.5–62.5 kW', 'mech'], ['chill', 730, 120, '冰水機與泵', '15–40 kW', 'mech'], ['ghs', 730, 200, 'GHS', '3–5 kW', 'mech'],
      ['elec', 730, 290, '控制電子', '10–100 kW', 'clean'], ['dc', 730, 370, '精密直流 ×110 台', '3–7 kW', 'clean'], ['clk', 730, 450, '時脈與網路', '2–5 kW', 'clean'],
      ['dec', 730, 540, '即時解碼', '5–50 kW', 'comp'], ['hvac', 730, 620, '電子區空調', '5–50 kW', 'comp'],
    ];
    N.forEach(([id, x, y, w, h, t, s]) => { box(x, y, w, h, { fill: 'rgba(56,198,217,.08)' }, g); txt(x + w / 2, y + 32, t, { anchor: 'middle', bold: true, size: 16 }, g); txt(x + w / 2, y + 58, s, { anchor: 'middle', fill: '#9fb0c8', size: 13 }, g); });
    loads.forEach(([id, x, y, t, s]) => { box(x, y, 190, 62, {}, g); txt(x + 95, y + 23, t, { anchor: 'middle', bold: true }, g); txt(x + 95, y + 45, s, { anchor: 'middle', fill: '#e0a54a', size: 13 }, g); });
    // 冷凍機
    const fr = el('g', {}, g);
    box(1000, 90, 160, 520, { fill: 'rgba(79,140,255,.06)', stroke: 'rgba(79,140,255,.6)' }, fr);
    ['300 K', '50 K', '4 K', 'Still', 'CP', 'MXC'].forEach((t, i) => { const y = 140 + i * 80; el('line', { x1: 1015, x2: 1145, y1: y, y2: y, stroke: '#4f8cff', 'stroke-width': 3, 'stroke-opacity': .7 - i * .08 }, fr); txt(1080, y - 14, t, { anchor: 'middle', size: 12, fill: '#a9c6ff' }, fr); });
    txt(1080, 590, '稀釋冷凍機', { anchor: 'middle', bold: true }, fr);
    st.T = txt(1080, 625, 'MXC 10 mK', { anchor: 'middle', fill: '#3ccf8e', bold: true }, fr);
    // 流
    const F = (d, c, r) => new Flow(d, c, r, g);
    st.flows = {
      grid: F('M170,370 L230,370', '#e0a54a', 9),
      mech: F('M370,360 C410,360 410,165 450,165', '#ff8a5c', 4), clean: F('M370,370 L450,375', '#38c6d9', 3.5), comp: F('M370,380 C410,380 410,585 450,585', '#9d8cff', 2),
      comp1: F('M650,150 L730,71', '#ff8a5c', 2.5), chill: F('M650,165 L730,151', '#ff8a5c', 1.4), ghs: F('M650,180 L730,231', '#ff8a5c', .4),
      elec: F('M650,360 L730,321', '#38c6d9', 2.6), dc: F('M650,375 L730,401', '#38c6d9', .5), clk: F('M650,390 L730,481', '#38c6d9', .4),
      dec: F('M650,575 L730,571', '#9d8cff', 1.2), hvac: F('M650,595 L730,651', '#9d8cff', 1.2),
      tofr1: F('M920,71 C960,71 960,200 1000,200', '#ff8a5c', 1.5), tofr2: F('M920,321 C960,321 960,380 1000,380', '#38c6d9', 1.5),
    };
    // 痛點
    const PP = [
      [300, 320, 1, 'UPS 要為「馬達群」設計', '3–5 台壓縮機的同時啟動電流決定 UPS 級距；冷卻中斷約 2 分鐘 QPU 就超過 1 K，恢復 2–5 天（LRZ）。'],
      [550, 110, 2, '壓縮機：最大的單一負載', '每支脈衝管 ≈ 12.5 kW 壓縮機。熱預算不夠 → 多加脈衝管 → 多加電與冷卻水；還要 N+1。'],
      [550, 320, 3, '數百個交流入口的接地', '約 250–350 台設備，每台 0.5–1 mA 漏電流 → 地線 0.1–0.35 A → 數百 µV 到 mV 的地電位，偏壓要求是 µV。'],
      [728, 372, 4, '2,500–3,000 路精密直流', '約 110 台 24 通道儀器；單台合格不等於接起來合格；前一級電源的共模、熱漂移是關鍵。'],
      [1080, 330, 5, '低溫熱預算', '不改架構時 50 K 約 200 W、4 K 約 4.4 W、MXC 被動＋直流約 200 µW，都超過或逼近 3 個單元的容量。'],
      [410, 470, 6, '配電磁場', '250 kW、400 V 約 360 A；母線與變壓器要遠離冷凍機並成對配線（LRZ 要求交流 ≪ 1 µT）。'],
      [728, 542, 7, '解碼要緊鄰機台', '超導回饋預算只有個位數到數十 µs；解碼機櫃沿用 AI 機房供電與液冷。'],
    ];
    st.pp = PP.map(([x, y, n, t, d]) => {
      const gg = el('g', { class: 'pp' }, g);
      const c = el('circle', { cx: x, cy: y, r: 13, fill: '#ff5a5f' }, gg); txt(x, y + 1, String(n), { anchor: 'middle', bold: true, size: 13, fill: '#fff' }, gg);
      gg.addEventListener('click', () => { st.sel = n; renderPP(); });
      return { c, t, d, n };
    });
    const renderPP = () => {
      const p = st.pp.find(q => q.n === st.sel);
      metrics([
        ['設施總功率（中點）', '約 200 kW', 'info'], ['冷卻鏈（要撐過斷電）', '約 80 kW', 'warn'], ['UPS 容量', '80–270 kW', 'warn'],
        ...(p ? [['痛點 ' + p.n, p.t, 'bad'], ['', '', '']] : []),
      ]);
      if (p) metBox.insertAdjacentHTML('beforeend', `<div class="k" style="grid-column:1/3;color:#d3dcea;line-height:1.6">${p.d}</div>`);
    };
    renderPP();
    toggle('模擬斷電（市電中斷）', false, v => { st.outage = v; st.t = 0; });
    toggle('冷卻鏈接 UPS＋發電機', true, v => st.ups.cool = v);
    toggle('控制與量測接 UPS', true, v => st.ups.ctrl = v);
    toggle('運算接 UPS', true, v => st.ups.comp = v);
    st.t = 0; st.temp = 0.01;
  },
  tick(st, dt) {
    st.t += dt; const out = st.outage, f = st.flows;
    f.grid.on = !out;
    const cool = !out || st.ups.cool, ctrl = !out || st.ups.ctrl, comp = !out || st.ups.comp;
    [f.mech, f.comp1, f.chill, f.ghs, f.tofr1].forEach(x => x.on = cool);
    [f.clean, f.elec, f.dc, f.clk, f.tofr2].forEach(x => x.on = ctrl);
    [f.comp, f.dec, f.hvac].forEach(x => x.on = comp);
    Object.values(f).forEach(x => x.tick(dt));
    // 示意：冷卻中斷時 MXC 溫度上升（動畫時間 1 秒 ≈ 實際 20 秒）
    if (out && !st.ups.cool) st.temp = Math.min(300, st.temp * Math.exp(dt * 0.9)); else st.temp = Math.max(0.01, st.temp * Math.exp(-dt * 0.5));
    const T = st.temp; st.T.textContent = 'MXC ' + (T < 1 ? (T * 1000).toFixed(0) + ' mK' : T.toFixed(1) + ' K');
    st.T.setAttribute('fill', T < 0.1 ? '#3ccf8e' : T < 1 ? '#e0a54a' : '#ff5a5f');
    st.pp.forEach(p => p.c.setAttribute('r', 12 + 2.5 * Math.sin(st.t * 4 + p.n)));
  } });

// 2. 規模計算器
S({ id: 'scale', title: '規模計算器：位元數一變，什麼先爆？', sub: '推論模型：可調耦合器 1.5 N、每饋線 8 位元、KIDE 級冷凍機 4,000 條線',
  desc: `<p>拉動<b>位元數</b>與<b>每位元控制電子功耗</b>，看同軸線、直流通道、交流入口、地線電流、設施用電怎麼成長。紅色代表超過門檻。</p>
  <p>切換成「低溫 CMOS＋多工」：進入冷凍機的線大幅減少（假設減為 1/16），但 4 K 要多出每位元約 1.5 mW 的熱負載，而且需要低溫電源轉換。</p>
  <p class="src">門檻：KIDE > 4,000 條 RF 線；地電位以 5 mΩ 接地阻抗、每台 0.75 mA 估算；偏壓要求 µV 級。</p>`,
  build(st) {
    st.N = 1000; st.W = 50; st.cryo = false;
    slider('量子位元數 N', 2, 4.3, 0.01, 3, v => fmtN(Math.round(10 ** v)), v => { st.N = Math.round(10 ** v); st.dirty = true; });
    slider('每位元室溫控制電子功耗', 1, 150, 1, 50, v => v + ' W', v => { st.W = v; st.dirty = true; });

S({ id: 'outage', title: '斷電時間軸：2 分鐘換 2–5 天', sub: '示意曲線：依 LRZ 公開數據（約 2 分鐘超過 1 K、恢復 2–5 天）繪製',

    [[1, '1 秒'], [60, '1 分'], [120, '2 分'], [3600, '1 小時'], [86400, '1 天'], [432000, '5 天']].forEach(([t, s]) => { const x = st.X(t); el('line', { x1: x, x2: x, y1: Y0, y2: Y1, stroke: 'rgba(140,170,220,.15)' }, g); txt(x, Y0 + 22, s, { anchor: 'middle', size: 12, fill: '#9fb0c8' }, g); });
    [[0.01, '10 mK'], [0.1, '100 mK'], [1, '1 K'], [4, '4 K'], [50, '50 K'], [300, '300 K']].forEach(([T, s]) => { const y = st.Y(T); el('line', { x1: X0, x2: X1, y1: y, y2: y, stroke: T === 1 ? 'rgba(255,90,95,.5)' : 'rgba(140,170,220,.12)', 'stroke-dasharray': T === 1 ? '6 4' : '' }, g); txt(X0 - 10, y, s, { anchor: 'end', size: 12, fill: T === 1 ? '#ff5a5f' : '#9fb0c8' }, g); });
    txt(st.X(130), st.Y(1) - 14, '超過 1 K → 需要完整校準', { size: 13, fill: '#ff5a5f' }, g);
    txt(X1, Y0 + 44, '時間（對數）', { anchor: 'end', size: 12, fill: '#9fb0c8' }, g);

  curve(st, t) { // 示意：冷卻停止時刻 t0，升溫；恢復後降溫 3.5 天
    const t0 = st.sc === 'none' ? 0 : st.sc === 'gen' ? st.ups * 60 : Infinity;
    if (t < t0) return 0.01;
    const dt = t - t0, Tmax = 300;
    const up = Math.min(Tmax, 0.01 * Math.pow(1 + dt / 1.2, 1.0)); // 約 120 秒到 1 K
    const restart = t0 + 3600; // 假設 1 小時後恢復供電、開始重新降溫
    if (t < restart) return up;
    const Tr = Math.min(Tmax, 0.01 * (1 + 3600 / 1.2));
    const cool = 3.5 * 86400, x = Math.min(1, (t - restart) / cool);
    return Math.max(0.01, Tr * Math.pow(0.01 / Tr, x));

  tick(st, dt) {
    if (st.dirty) { st.dirty = false; this.render(st); }
    st.play = (st.play + dt / 12) % 1.05; const p = Math.min(1, st.play);

    st.cur.setAttribute('cx', st.X(t)); st.cur.setAttribute('cy', st.Y(T));
    const ts = t < 60 ? t.toFixed(0) + ' 秒' : t < 3600 ? (t / 60).toFixed(1) + ' 分' : t < 86400 ? (t / 3600).toFixed(1) + ' 小時' : (t / 86400).toFixed(1) + ' 天';
    st.lab.textContent = `t = ${ts}　MXC ≈ ${T < 1 ? (T * 1000).toFixed(0) + ' mK' : T.toFixed(1) + ' K'}`;

  } });

    first: '作為 ⑥ 的第二代，不單獨立項', done: '與一家儀器廠完成共同設計', go: 'scale',
    d: [['與儀器廠的分工界線', '共同設計，我們負責到通道群的類比電源軌'], ['通道間經共用電源耦合', '分群隔離、每群獨立穩壓'], ['密度與散熱', '背板液冷或恆溫風道'], ['架構可能被低溫化取代', '保留送進冷凍機的介面，與 ⑧ 共用技術']] },
  { n: 10, st: 2, name: '模組化量子資料中心配電', tag: 'A', what: '把 ① 做成可複製的「量子單元」模組，並排擴充到 MW 等級',
    first: '把 ① 每個案子的設計模組化', done: '需求出現時已有可複製的設計', go: 'field',
    d: [['大電流母線的磁場', '提高配電電壓、母線成對並行、保持距離'], ['800 VDC 的靜磁場', '先評估交流與直流方案，不預設答案'], ['數十台壓縮機的群控', '延伸 ④ 的群控功能'], ['市場 2029 年後才出現', '不獨立開發產品']] },
  { n: 11, st: 2, name: '解碼機櫃供電與液冷', tag: 'E', what: '即時解碼的 FPGA／GPU 機櫃：規格同 AI 機櫃，要補的是「緊鄰量子機台」的條件',
    first: '量現有 AI 機櫃電源的磁場與漏電流（可提前做）', done: '定出與量子機台的最小距離與應用指南', go: 'overview',
    d: [['大功率電源、泵、風扇緊鄰量子機台', '量測後定最小距離，泵浦遠端放置'], ['低延遲限制距離', '每公尺約 5 ns，對微秒級延遲影響小'], ['負載快速變動造成電源暫態', '走獨立匯流排與 UPS 分層'], ['需求量不明', '只做驗證與應用指南']] },
];
const FEEDS = { 2: [1, 10, 11], 3: [5, 6, 7, 9], 1: [10], 4: [1, 10], 5: [6, 9], 6: [9], 8: [9, 10] };
const CHECKS = [[6, '取得場地規劃文件了嗎？QGP 量測台量得出產品差異嗎？'], [12, '示範場域運轉了嗎？勘查找到可對應產品的問題嗎？'], [18, '有儀器廠或冷凍機廠願意共同開發嗎？'], [36, 'OEM 有設計導入嗎？低溫 CMOS 與模組化冷凍機進度如何？']];
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪';
S({ id: 'devplan', title: '開發計畫：11 個項目怎麼做', sub: '規劃建議（非既有計畫）。2026-11-24 修正：多數項目是整合工程，只有 4 K 低溫轉換是新技術；優先序見開發計畫第 0A 節',
  desc: `<p><b>點選項目</b>看：要做出什麼、第一步、困難與解法、完成判準。綠框是它<b>需要先有</b>的項目，金框是<b>靠它提供成果</b>的項目。</p>
  <p>拉動<b>時間</b>可以看各階段何時啟動，以及第 6、12、18、36 個月的檢查點要回答什麼問題。勾選「自動導覽」會依建議的啟動順序逐項播放。</p>
  <p class="src">內容來源：docs/我們量子供電產品開發計畫.md</p>`,
  build(st) {
    st.sel = 2; st.month = 0; st.auto = false; st.t = 0; st.k = 0;
    st.order = [2, 3, 1, 6, 5, 4, 7, 11, 8, 9, 10];
    toggle('自動導覽（依建議啟動順序）', false, v => { st.auto = v; st.t = 0; });
    slider('時間', 0, 84, 1, 0, v => v === 0 ? '啟動' : `第 ${v} 個月`, v => { st.month = v; st.dirty = true; });
    const cols = ['#3ccf8e', '#e0a54a', '#9d8cff'], names = ['0–1 年：建立案例與規格', '1–3 年：進入供應鏈', '3–7 年：下一代架構'], y0 = [30, 250, 500];
    st.btn = {};
    [0, 1, 2].forEach(s => {
      txt(30, y0[s], names[s], { size: 17, bold: true, fill: cols[s] });
      el('line', { x1: 30, x2: 530, y1: y0[s] + 16, y2: y0[s] + 16, stroke: cols[s], 'stroke-width': 2 });
      PLAN.filter(p => p.st === s).forEach((p, j) => {
        const x = 30 + (j % 2) * 255, y = y0[s] + 32 + Math.floor(j / 2) * 84, g = el('g', { class: 'pp' });
        const r = box(x, y, 245, 70, { fill: 'rgba(255,255,255,.05)', stroke: cols[s] }, g);
        txt(x + 14, y + 24, CIRC[p.n - 1] + ' ' + p.name, { size: 14, bold: true }, g);
        txt(x + 14, y + 50, '矩陣 ' + p.tag, { size: 12, fill: cols[s] }, g);
        g.addEventListener('click', () => { st.sel = p.n; st.auto = false; ctlBox.querySelector('input[type=checkbox]').checked = false; st.dirty = true; });
        st.btn[p.n] = { g, r, col: cols[s] };
      });
    });
    const fo = el('foreignObject', { x: 560, y: 20, width: 620, height: 720 });
    st.detail = document.createElement('div');
    st.detail.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    st.detail.style.cssText = 'font-size:15px;line-height:1.6;color:#d3dcea;background:rgba(12,20,36,.9);border:1px solid rgba(140,170,220,.3);border-radius:12px;padding:16px 18px;height:100%;overflow:auto;box-sizing:border-box';
    fo.appendChild(st.detail);
    st.goBtn = null; st.dirty = true;
  },
  render(st) {
    const p = PLAN.find(q => q.n === st.sel), start = [0, 12, 36];
    const needs = Object.keys(FEEDS).filter(k => FEEDS[k].includes(p.n)).map(Number), feeds = FEEDS[p.n] || [];
    PLAN.forEach(q => {
      const b = st.btn[q.n], active = st.month >= start[q.st];
      b.g.setAttribute('opacity', active ? 1 : 0.4);
      const c = q.n === p.n ? '#ffffff' : needs.includes(q.n) ? '#3ccf8e' : feeds.includes(q.n) ? '#e0a54a' : b.col;
      b.r.setAttribute('stroke', c); b.r.setAttribute('stroke-width', q.n === p.n ? 4 : (needs.includes(q.n) || feeds.includes(q.n)) ? 3.5 : 1.2);
      b.r.setAttribute('fill', q.n === p.n ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.05)');
    });
    const li = a => a.length ? a.map(n => CIRC[n - 1] + ' ' + PLAN[n - 1].name).join('、') : '（無）';
    st.detail.innerHTML = `<div style="color:${st.btn[p.n].col};font-size:13px">${['0–1 年', '1–3 年', '3–7 年'][p.st]} · 矩陣 ${p.tag}</div>
      <div style="font-size:22px;font-weight:700;color:#fff;margin:2px 0 8px">${CIRC[p.n - 1]} ${p.name}</div>
      <div><b style="color:#fff">要做出什麼：</b>${p.what}</div>
      <div style="margin-top:6px"><b style="color:#38c6d9">第一步：</b>${p.first}</div>
      <table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:14px">
        <tr><th style="text-align:left;padding:6px 8px;background:#12304e;color:#fff;width:44%">困難</th><th style="text-align:left;padding:6px 8px;background:#12304e;color:#fff">可能的解法</th></tr>
        ${p.d.map(([a, b], i) => `<tr style="background:${i % 2 ? 'transparent' : 'rgba(255,255,255,.04)'}"><td style="padding:7px 8px;color:#ff9a9d;vertical-align:top">${a}</td><td style="padding:7px 8px;vertical-align:top">${b}</td></tr>`).join('')}
      </table>
      <div style="margin-top:12px"><b style="color:#3ccf8e">完成判準：</b>${p.done}</div>
      <div style="margin-top:8px;font-size:13px"><span style="color:#3ccf8e">■ 需要先有：</span>${li(needs)}<br><span style="color:#e0a54a">■ 成果提供給：</span>${li(feeds)}</div>
      <div style="margin-top:12px"><a href="#${p.go}" style="color:#38c6d9">→ 看對應的痛點場景</a></div>`;
    const ck = CHECKS.filter(c => c[0] <= st.month).pop(), nx = CHECKS.find(c => c[0] > st.month);
    metrics([['目前', st.month < 12 ? '第一階段' : st.month < 36 ? '第二階段' : '第三階段', 'info'],
      ['已啟動項目', PLAN.filter(q => st.month >= start[q.st]).length + ' / 11', 'info'],
      ['下一個檢查點', nx ? `第 ${nx[0]} 個月` : '—', 'warn']]);
    if (ck) metBox.insertAdjacentHTML('beforeend', `<div class="k" style="grid-column:1/3;color:#d3dcea;line-height:1.6"><b style="color:#e0a54a">第 ${ck[0]} 個月檢查點：</b>${ck[1]}</div>`);
  },
  tick(st, dt) {
    if (st.auto) { st.t += dt; if (st.t > 6) { st.t = 0; st.k = (st.order.indexOf(st.sel) + 1) % st.order.length; st.sel = st.order[st.k]; st.dirty = true; } }
    if (st.dirty) { st.dirty = false; this.render(st); }
  } });

// ───────────────────────── 主程式 ─────────────────────────
const App = {
  i: 0, st: {}, paused: false, last: 0,
  go(i) {
    this.i = (i + SCENES.length) % SCENES.length; const sc = SCENES[this.i];
    svg.innerHTML = ''; ctlBox.innerHTML = ''; metBox.innerHTML = ''; this.st = {};
    $('scene-num').textContent = `場景 ${this.i + 1} / ${SCENES.length}`; $('scene-title').textContent = sc.title;
    $('scene-sub').textContent = sc.sub; $('scene-desc').innerHTML = sc.desc;
    document.querySelectorAll('#scene-nav button').forEach((b, k) => b.classList.toggle('active', k === this.i));
    history.replaceState(null, '', location.pathname + location.search + '#' + sc.id);
    sc.build(this.st); if (sc.tick) sc.tick.call(sc, this.st, 0);
  },
  loop(ts) {
    const dt = Math.min(0.05, (ts - this.last) / 1000 || 0); this.last = ts;
    const sc = SCENES[this.i]; if (!this.paused && sc.tick) sc.tick.call(sc, this.st, dt);
    requestAnimationFrame(t => this.loop(t));
  },
  start() {
    const nav = $('scene-nav');
    SCENES.forEach((s, k) => { const b = document.createElement('button'); b.textContent = (k + 1) + ' ' + s.title.split('：')[0]; b.onclick = () => this.go(k); nav.appendChild(b); });
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' && e.target.type === 'range' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
      if (e.key === 'ArrowRight') this.go(this.i + 1); else if (e.key === 'ArrowLeft') this.go(this.i - 1);
      else if (e.key === ' ') { this.paused = !this.paused; $('paused').style.display = this.paused ? 'block' : 'none'; e.preventDefault(); }
      else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
      else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    });
    if (new URLSearchParams(location.search).has('noui')) document.body.classList.add('hide-ui');
    window.addEventListener('hashchange', () => { const j = SCENES.findIndex(s => s.id === location.hash.slice(1)); if (j >= 0 && j !== this.i) this.go(j); });
    const h = location.hash.slice(1), k = SCENES.findIndex(s => s.id === h);
    this.go(k >= 0 ? k : 0); requestAnimationFrame(t => { this.last = t; this.loop(t); });
  },
};
App.start();
</script>

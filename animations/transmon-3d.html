<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Transmon 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：全螢幕 3D 舞台，右側（手機為底部）說明面板，底部章節列。單一深色主題：稀釋冷凍機內部 */
:root {
  --bg: #0a0c11;
  --panel: rgba(16, 19, 26, 0.88);
  --panel-solid: #12151c;
  --fg: #e8ebf0;
  --muted: #98a1b0;
  --hair: rgba(232, 235, 240, 0.12);
  --gold: #d6b04a;
  --teal: #35b8ac;
  --copper: #d77b45;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }

.brand {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: baseline; gap: 12px; pointer-events: none;
}
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; }
.brand span { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

.panel {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 370px; max-height: calc(100% - 160px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel); border: 1px solid var(--hair); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 18px 20px 20px;
}
.kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; }
.panel h2 { margin: 6px 0 10px; font-family: var(--font-display); font-size: 24px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.panel p { margin: 0 0 10px; font-size: 14px; line-height: 1.75; color: #cfd5de; }
.panel p b { color: var(--fg); font-weight: 600; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 12px 0 14px; padding: 10px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-mono); font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label.row { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 13px; color: var(--muted); }
.controls input[type="range"] { flex: 1; min-width: 0; accent-color: var(--copper); }
.btn {
  font: 500 13px/1 var(--font-body); color: var(--fg);
  background: transparent; border: 1px solid rgba(232, 235, 240, 0.28); border-radius: 6px;
  padding: 9px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #17140a; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { background: rgba(53, 184, 172, 0.16); border-color: var(--teal); color: #bff0ea; }
.btn:focus-visible, .chap:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--teal); }
.meter { width: 100%; height: 6px; border-radius: 3px; background: rgba(232, 235, 240, 0.1); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 120ms linear; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
.hist { display: flex; gap: 10px; width: 100%; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.hist span b { color: var(--fg); font-weight: 600; }

nav.chapters {
  position: fixed; z-index: 6;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; justify-content: center; pointer-events: none;
}
.chapters .rail { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; pointer-events: auto; overflow-x: auto; max-width: 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.chap { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font: 500 13px/1 var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 10px 12px; cursor: pointer; }
.chap em { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: rgba(152, 161, 176, 0.7); }
.chap:hover { color: var(--fg); }
.chap[aria-current="true"] { background: rgba(214, 176, 74, 0.14); color: var(--fg); }
.chap[aria-current="true"] em { color: var(--gold); }

.tag { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -100%); font-size: 12px; line-height: 1.3; color: var(--fg); background: rgba(10, 12, 17, 0.78); border: 1px solid var(--hair); border-radius: 5px; padding: 4px 8px; white-space: nowrap; transition: opacity 200ms; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 1px; height: 7px; background: rgba(232, 235, 240, 0.4); }
.tag.mono { font-family: var(--font-mono); font-size: 11px; }
.tag.flat { transform: translate(-50%, -50%); background: transparent; border: 0; padding: 0; }
.tag.flat::after { display: none; }
.tag.gold { color: var(--gold); } .tag.teal { color: var(--teal); } .tag.copper { color: var(--copper); }
.hint { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); font-size: 12px; color: var(--muted); pointer-events: none; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }

@media (max-width: 760px) {
  .brand h1 { font-size: 18px; }
  .brand span { display: none; }
  .panel {
    top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    width: auto; max-height: 44%;
    padding: 14px 16px 16px;
  }
  .panel h2 { font-size: 19px; margin-bottom: 6px; }
  .panel p { font-size: 13px; line-height: 1.65; }
  .chap span { display: none; }
  .chap { padding: 10px 14px; }
  .hint { display: none; }
  .tag { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .meter i, .tag { transition: none; } }
</style>

<div id="stage" aria-label="Transmon 3D 場景，可拖曳旋轉、滾輪或雙指縮放"></div>
<div class="fallback" id="fallback" hidden>這個瀏覽器無法啟用 WebGL，所以 3D 場景無法顯示。請改用桌面版 Chrome、Edge、Safari 或 Firefox 開啟。</div>

<div class="brand"><h1>Transmon 3D</h1><span>超導量子位元互動導覽</span></div>

<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="hint">拖曳旋轉 ・ 滾輪縮放 ・ ← → 切換章節</div>

<nav class="chapters" aria-label="章節">
  <div class="rail" id="rail"></div>
</nav>

<div id="tags"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COL = { bg: 0x0a0c11, gold: 0xd6b04a, teal: 0x35b8ac, copper: 0xd77b45, metal: 0xb7bec8, gap: 0x0f1a2c, sub: 0x16263f, white: 0xe8ebf0, muted: 0x98a1b0 };

  // ---------- 物理數值（E_J/h = 15 GHz, E_C/h = 250 MHz，數值對角化） ----------
  const PHYS = {
    trE: [2.676, 7.890, 12.821, 17.439],   // 相對位能井底，GHz
    lcE: [2.739, 8.216, 13.693, 19.170],
    EJ: 15,
  };

  // ---------- 渲染器 ----------
  const stage = document.getElementById("stage");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    document.getElementById("fallback").hidden = false;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.bg);
  scene.fog = new THREE.Fog(COL.bg, 38, 85);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xc8d6ff, 0x1a120a, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(10, 18, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(0x7fd8cf, 0.35); rim.position.set(-12, 6, -10); scene.add(rim);

  const mat = {
    sub: new THREE.MeshStandardMaterial({ color: COL.sub, roughness: 0.2, metalness: 0.05 }),
    ground: new THREE.MeshStandardMaterial({ color: 0x6b7482, roughness: 0.5, metalness: 0.45 }),
    gap: new THREE.MeshStandardMaterial({ color: COL.gap, roughness: 0.6, metalness: 0.0 }),
    metal: new THREE.MeshStandardMaterial({ color: COL.metal, roughness: 0.32, metalness: 0.55 }),
    pad: new THREE.MeshStandardMaterial({ color: 0xaab2bd, roughness: 0.28, metalness: 0.6, emissive: new THREE.Color(COL.gold), emissiveIntensity: 0 }),
    res: new THREE.MeshStandardMaterial({ color: COL.metal, roughness: 0.32, metalness: 0.55, emissive: new THREE.Color(COL.teal), emissiveIntensity: 0 }),
    jj: new THREE.MeshStandardMaterial({ color: COL.copper, roughness: 0.35, metalness: 0.4, emissive: new THREE.Color(0x4a1d08), emissiveIntensity: 0.6 }),
    glowTeal: new THREE.MeshBasicMaterial({ color: COL.teal }),
    glowGold: new THREE.MeshBasicMaterial({ color: COL.gold }),
  };
  const box = (w, h, d, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; };
  const lineFrom = (pts, color, opacity = 1) => {
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity }));
  };

  // ---------- 標籤 ----------
  const tagRoot = document.getElementById("tags");
  const tags = [];
  function tag(text, pos, chapters, cls = "") {
    const el = document.createElement("div");
    el.className = "tag " + cls; el.textContent = text; tagRoot.appendChild(el);
    const t = { el, pos: pos.clone ? pos : new THREE.Vector3(...pos), chapters, on: true };
    tags.push(t); return t;
  }

  // =====================================================================
  // 第 1 章 + 第 5 章：晶片
  // =====================================================================
  const chip = new THREE.Group(); scene.add(chip);
  chip.add(box(12.6, 0.9, 12.6, mat.sub, 0, -0.53, 0));
  chip.add(box(12, 0.08, 12, mat.ground, 0, -0.04, 0));
  const GAP_Y = 0.006, LINE_Y = 0.03;
  // CPW 線段：深色間隙 + 金屬中心導體
  function cpw(points, w = 0.14, g = 0.11, m = mat.metal) {
    const grp = new THREE.Group();
    for (let i = 0; i < points.length - 1; i++) {
      const [x1, z1] = points[i], [x2, z2] = points[i + 1];
      const horiz = z1 === z2, len = horiz ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
      const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
      const gw = horiz ? len + w + 2 * g : w + 2 * g, gd = horiz ? w + 2 * g : len + w + 2 * g;
      grp.add(box(gw, 0.012, gd, mat.gap, cx, GAP_Y, cz));
      grp.add(box(horiz ? len + w : w, 0.05, horiz ? w : len + w, m, cx, LINE_Y, cz));
    }
    return grp;
  }
  // 十字電容板
  const PADZ = 0.4, ARM = 3.2, PW = 0.62, PG = 0.32;
  chip.add(box(2 * ARM + 2 * PG, 0.012, PW + 2 * PG, mat.gap, 0, GAP_Y, PADZ));
  chip.add(box(PW + 2 * PG, 0.012, 2 * ARM + 2 * PG, mat.gap, 0, GAP_Y, PADZ));
  const padH = box(2 * ARM, 0.07, PW, mat.pad, 0, 0.04, PADZ);
  const padV = box(PW, 0.07, 2 * ARM, mat.pad, 0, 0.04, PADZ);
  chip.add(padH, padV);
  // SQUID：十字下端與接地面之間
  const SQZ = PADZ + ARM + 0.62;
  chip.add(box(1.1, 0.012, 0.9, mat.gap, 0, GAP_Y, SQZ - 0.05));
  chip.add(box(0.12, 0.05, 0.36, mat.metal, 0, LINE_Y, PADZ + ARM + 0.18));
  [[-0.3, 0], [0.3, 0]].forEach(([x]) => chip.add(box(0.08, 0.05, 0.5, mat.metal, x, LINE_Y, SQZ)));
  chip.add(box(0.68, 0.05, 0.08, mat.metal, 0, LINE_Y, SQZ - 0.25));
  chip.add(box(0.68, 0.05, 0.08, mat.metal, 0, LINE_Y, SQZ + 0.25));
  const jjL = box(0.16, 0.09, 0.14, mat.jj, -0.3, 0.05, SQZ); const jjR = box(0.16, 0.09, 0.14, mat.jj, 0.3, 0.05, SQZ);
  chip.add(jjL, jjR);
  chip.add(box(0.12, 0.05, 0.3, mat.metal, 0, LINE_Y, SQZ + 0.42));
  // XY 驅動線（左）
  chip.add(cpw([[-6, PADZ], [-ARM - 0.75, PADZ]]));
  // Z 磁通線（下）
  chip.add(cpw([[1.05, 6], [1.05, SQZ + 0.05], [0.55, SQZ + 0.05]]));
  // 讀取共振腔（蜿蜒）與饋線
  const resPts = [[0, PADZ - ARM - 0.55], [0, -3.25], [1.6, -3.25], [1.6, -3.65], [-1.6, -3.65], [-1.6, -4.05], [1.6, -4.05], [1.6, -4.45], [-0.2, -4.45], [-0.2, -4.85], [-2.4, -4.85]];
  const resonator = cpw(resPts, 0.14, 0.11, mat.res); chip.add(resonator);
  const FEEDZ = -5.35;
  chip.add(cpw([[-6, FEEDZ], [6, FEEDZ]], 0.2, 0.13));

  // 脈衝粒子
  function makePulses(n, color) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 }));
      s.position.y = 0.16; chip.add(s); arr.push(s);
    }
    return arr;
  }
  const xyPulses = makePulses(6, COL.teal);
  const feedPhotons = makePulses(8, COL.teal);
  const resGlowLight = new THREE.PointLight(COL.teal, 0, 6); resGlowLight.position.set(0, 1.2, -3.9); chip.add(resGlowLight);
  const padLight = new THREE.PointLight(COL.gold, 0, 9); padLight.position.set(0, 1.6, PADZ); chip.add(padLight);

  // 第 1 章標籤
  tag("十字電容板 C_Σ", [2.4, 0.15, PADZ], [0]);
  tag("SQUID：兩個約瑟夫森結", [0, 0.15, SQZ], [0, 1]);
  tag("讀取共振腔 ~7 GHz", [1.6, 0.15, -3.65], [0, 4]);
  tag("饋線", [4.4, 0.15, FEEDZ], [0, 4]);
  tag("XY 驅動線", [-5.0, 0.15, PADZ], [0]);
  tag("Z 磁通線", [1.05, 0.15, 5.3], [0]);
  tag("接地面（Al）", [-4.3, 0.1, 4.2], [0]);
  tag("基板（矽 / 藍寶石）", [6.3, -0.6, 5.0], [0]);

  // 第 5 章：S21 曲線與 IQ 平面（浮在晶片上方）
  const readout = new THREE.Group(); readout.position.set(0, 3.2, -5.6); readout.rotation.x = -0.28; scene.add(readout); readout.updateMatrixWorld();
  const panelMat = new THREE.MeshBasicMaterial({ color: 0x0e1219, transparent: true, opacity: 0.82, side: THREE.DoubleSide });
  const s21Panel = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.6), panelMat); s21Panel.position.set(-2.6, 0, 0); readout.add(s21Panel);
  const iqPanel = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6), panelMat); iqPanel.position.set(2.8, 0, 0); readout.add(iqPanel);
  function lorentz(f0, color) {
    const pts = [];
    for (let i = 0; i <= 160; i++) {
      const x = -2.8 + 5.6 * i / 160;           // 頻率軸：每單位 0.5 MHz
      const df = (x - f0) / 0.55;
      pts.push(new THREE.Vector3(-2.6 + x, 1.1 - 2.3 / (1 + df * df), 0.01));
    }
    return lineFrom(pts, color);
  }
  const curve0 = lorentz(-0.77, COL.teal), curve1 = lorentz(0.77, COL.gold);
  readout.add(curve0, curve1);
  readout.add(lineFrom([new THREE.Vector3(-2.6, -1.45, 0.01), new THREE.Vector3(-2.6, 1.5, 0.01)], COL.white, 0.45)); // 探測頻率
  readout.add(lineFrom([new THREE.Vector3(-5.5, -1.45, 0.01), new THREE.Vector3(0.3, -1.45, 0.01)], COL.muted, 0.5));
  readout.add(lineFrom([new THREE.Vector3(1.2, 0, 0.01), new THREE.Vector3(4.4, 0, 0.01)], COL.muted, 0.4));
  readout.add(lineFrom([new THREE.Vector3(2.8, -1.6, 0.01), new THREE.Vector3(2.8, 1.6, 0.01)], COL.muted, 0.4));
  // IQ 點群
  const IQ0 = new THREE.Vector2(1.9, 0.75), IQ1 = new THREE.Vector2(3.7, -0.75);
  const iqMax = 400; const iqPos = new Float32Array(iqMax * 3); const iqCol = new Float32Array(iqMax * 3);
  const iqGeo = new THREE.BufferGeometry();
  iqGeo.setAttribute("position", new THREE.BufferAttribute(iqPos, 3));
  iqGeo.setAttribute("color", new THREE.BufferAttribute(iqCol, 3));
  iqGeo.setDrawRange(0, 0);
  readout.add(new THREE.Points(iqGeo, new THREE.PointsMaterial({ size: 0.09, vertexColors: true })));
  let iqCount = 0;
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  function addIQ(bit) {
    const c = bit ? IQ1 : IQ0, i = iqCount % iqMax;
    iqPos[i * 3] = c.x + gauss() * 0.22; iqPos[i * 3 + 1] = c.y + gauss() * 0.22; iqPos[i * 3 + 2] = 0.02;
    const col = new THREE.Color(bit ? COL.gold : COL.teal);
    iqCol[i * 3] = col.r; iqCol[i * 3 + 1] = col.g; iqCol[i * 3 + 2] = col.b;
    iqCount++; iqGeo.setDrawRange(0, Math.min(iqCount, iqMax));
    iqGeo.attributes.position.needsUpdate = true; iqGeo.attributes.color.needsUpdate = true;
  }
  const rTag = (t, x, y, ch, cls) => tag(t, readout.localToWorld(new THREE.Vector3(x, y, 0.02)), ch, "flat " + cls);
  rTag("反射振幅 vs 頻率（±0.77 MHz）", -2.6, 1.95, [4], "");
  rTag("|0⟩", -3.37, -1.05, [4], "teal mono");
  rTag("|1⟩", -1.83, -1.05, [4], "gold mono");
  rTag("探測頻率", -2.6, -1.75, [4], "mono");
  rTag("IQ 平面", 2.8, 1.95, [4], "");
  rTag("|0⟩", IQ0.x, IQ0.y + 0.55, [4], "teal mono");
  rTag("|1⟩", IQ1.x, IQ1.y - 0.6, [4], "gold mono");

  // =====================================================================
  // 第 2 章：約瑟夫森結放大模型
  // =====================================================================
  const JX = 42;
  const jj = new THREE.Group(); jj.position.set(JX, 0, 0); scene.add(jj);
  jj.add(box(13, 0.4, 5, mat.sub, 0, -0.45, 0));
  const alMat = new THREE.MeshStandardMaterial({ color: 0xc7cdd6, roughness: 0.3, metalness: 0.55, transparent: true, opacity: 0.55, depthWrite: false });
  const bottomEl = box(8, 0.5, 1.8, alMat, -2, 0, 0);
  const topEl = box(6.5, 0.5, 1.8, alMat, 2.75, 0.67, 0);
  const barrier = box(2.5, 0.16, 1.8, new THREE.MeshStandardMaterial({ color: 0xb37ad6, roughness: 0.5, transparent: true, opacity: 0.55, emissive: new THREE.Color(0x3a1b55), emissiveIntensity: 0.5 }), 0.75, 0.33, 0);
  jj.add(bottomEl, barrier, topEl);
  // 庫柏對
  const pairs = [];

  stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = view.zoom; } });
  stage.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    const p = pointers.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) { view.yaw -= dx * 0.006; view.pitch = Math.max(-0.9, Math.min(0.75, view.pitch + dy * 0.005)); }
    else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) view.zoom = Math.max(0.45, Math.min(2.2, zoom0 * pinch0 / d)); }
  });
  const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", e => { e.preventDefault(); view.zoom = Math.max(0.45, Math.min(2.2, view.zoom * Math.exp(e.deltaY * 0.0012))); }, { passive: false });
  window.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });

  function desiredCamPos(out) {
    const c = CH[cur]; const t = new THREE.Vector3(...c.target);
    const off = new THREE.Vector3(...c.pos).sub(t);
    const sph = new THREE.Spherical().setFromVector3(off);
    sph.theta += view.yaw; sph.phi = Math.max(0.12, Math.min(Math.PI - 0.2, sph.phi - view.pitch)); sph.radius *= view.zoom;
    if (innerWidth < 760) sph.radius *= 1.15;
    if (camera.aspect < 1.2) sph.radius *= 1.2 / camera.aspect;   // 直立手機：拉遠讓整個場景入鏡
    return out.copy(t).add(new THREE.Vector3().setFromSpherical(sph));
  }

  // ---------- 狀態變數 ----------
  let jjPhi = 35 * Math.PI / 180, acMode = false, xyT = -1, excite = 0;

  // ---------- 尺寸 ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    // 桌面版面板在右側：把畫面中心往左移
    if (innerWidth >= 760) camera.setViewOffset(w, h, 195, 0, w, h);   // 讓出右側面板
    else camera.setViewOffset(w, h, 0, h * 0.2, w, h);                // 讓出底部面板
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---------- 每幀更新 ----------
  const tmpV = new THREE.Vector3(), camPos = new THREE.Vector3();
  let last = performance.now(), T = 0, first = true;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const speed = REDUCE ? 0.35 : 1; T += dt * speed;

    // 相機平滑
    desiredCamPos(tmpV);
    const k = first || REDUCE ? 1 : 1 - Math.exp(-dt * 3.2);
    camera.position.lerp(tmpV, k); camTarget.lerp(desired.target, k);
    camera.lookAt(camTarget); first = false;

    // 第 1 章：XY 脈衝與激發
    if (xyT >= 0) {
      xyT += dt;
      xyPulses.forEach((s, i) => { const u = (xyT * 1.4 - i * 0.07); const vis = u > 0 && u < 1; s.material.opacity = vis ? 1 - i * 0.12 : 0; s.position.set(-6 + (6 - ARM - 0.75) * Math.min(Math.max(u, 0), 1), 0.16, PADZ); });
      if (xyT * 1.4 > 1) { excite = 1; }
      if (xyT * 1.4 > 1.6) { xyT = -1; xyPulses.forEach(s => s.material.opacity = 0); }
    }
    excite *= Math.exp(-dt / 6);
    mat.pad.emissiveIntensity = 0.55 * excite + 0.04 * Math.sin(T * 2) + 0.04;
    padLight.intensity = 1.1 * excite;

    // 第 5 章：讀取光子
    measuring = Math.max(0, measuring - dt * 0.8);
    const resOn = cur === 4;
    feedPhotons.forEach((s, i) => { const u = ((T * 0.35 + i / feedPhotons.length) % 1); s.position.set(-6 + 12 * u, 0.16, FEEDZ); s.material.opacity = resOn ? 0.35 + 0.65 * measuring : 0; });
    mat.res.emissiveIntensity = resOn ? 0.25 + 0.6 * measuring + 0.1 * Math.sin(T * 3) : 0;
    resGlowLight.intensity = resOn ? 0.6 + 2 * measuring : 0;
    const p1 = P1();
    curve0.material.opacity = 1; curve0.material.transparent = true; curve1.material.transparent = true;
    curve0.material.opacity = 0.25 + 0.75 * (1 - p1); curve1.material.opacity = 0.25 + 0.75 * p1;

    // 第 2 章：約瑟夫森結
    if (cur === 1) {
      if (acMode) { jjPhi = (jjPhi + dt * 1.6) % (Math.PI * 2); }
      const I = Math.sin(jjPhi);
      pairs.forEach(g => {
        const u = g.userData; u.s = (u.s + dt * 0.08 * I + 1) % 1; u.spin += dt * 5;
        const [x, y] = pairPath(u.s); g.position.set(x, y + 0.02, u.z); g.rotation.y = u.spin;
      });
      const base = T * 0.9;
      ph1.userData.hand.rotation.z = base; ph2.userData.hand.rotation.z = base + jjPhi;
      updateWave(0, jjPhi, T);
      barrier.material.emissiveIntensity = 0.4 + 0.6 * Math.abs(I);
      const deg = ((jjPhi * 180 / Math.PI) % 360 + 360) % 360, c = Math.cos(jjPhi);
      const r2 = $("r2phi"); if (r2) {
        r2.textContent = deg.toFixed(0) + "°";
        $("r2I").textContent = I.toFixed(3);
        $("r2L").textContent = Math.abs(c) < 0.02 ? "→ ∞" : (1 / c).toFixed(2) + (c < 0 ? "（負電感）" : "");
        if (acMode) $("c2phi").value = deg <= 180 ? deg : 360 - deg;
      }
    }

    // 第 3 章：位能井
    if (cur === 2) {
      const E = trMode ? PHYS.trE : PHYS.lcE;
      levelBars.forEach((b, n) => {
        const e = E[n], ph = trMode ? Math.acos(1 - e / PHYS.EJ) : Math.sqrt(2 * e / PHYS.EJ);
        b.y += (e * SY - b.y) * (1 - Math.exp(-dt * 6)); b.w += (2 * ph * SX - b.w) * (1 - Math.exp(-dt * 6));
        b.m.position.set(0, b.y, 0); b.m.scale.x = b.w;
        levelTags[n].pos.set(PX - b.w / 2 - 0.55, b.y, 0);
      });
      for (let n = 0; n < 3; n++) { gapTags[n].el.textContent = (E[n + 1] - E[n]).toFixed(2) + " GHz"; gapTags[n].pos.set(PX + levelBars[n + 1].w / 2 + 1.25, (levelBars[n].y + levelBars[n + 1].y) / 2, 0); }
      const amp = 0.95, w = trMode ? 2.2 : 2.3; const phi = amp * Math.sin(T * w);
      const Uy = trMode ? PHYS.EJ * (1 - Math.cos(phi)) : PHYS.EJ * phi * phi / 2;
      ball.position.set(phi * SX, Uy * SY + 0.3, 0);
      arm.rotation.z = phi;
      cosTube.material.opacity = 1; parTube.material.opacity = trMode ? 0.5 : 0.95;
    }

    // 第 4 章：布洛赫球
    if (cur === 3 || cur === 4) {
      if (!anim && queue.length) { const q = queue.shift(); anim = { ...q, t: 0, from: state.clone() }; }
      if (anim) {
        anim.t += dt / (1.1 * anim.angle / Math.PI + 0.25);
        const u = Math.min(anim.t, 1);
        state.copy(anim.from).applyQuaternion(new THREE.Quaternion().setFromAxisAngle(anim.axis, anim.angle * u));
        if (u >= 1) anim = null;
      }
      arrow.setDirection(state.clone().normalize());
      tip.position.copy(state).multiplyScalar(R);
      if (cur === 3) {
        const tp = trailGeo.attributes.position.array, idx = trailN % TRAIL;
        if (anim || trailN === 0) { tp[idx * 3] = tip.position.x; tp[idx * 3 + 1] = tip.position.y; tp[idx * 3 + 2] = tip.position.z; trailN++; trailGeo.setDrawRange(0, Math.min(trailN, TRAIL)); trailGeo.attributes.position.needsUpdate = true; }
        if (trailN >= TRAIL) trailN = 1;
        ladderBars[0].material.color.setHex(COL.gold); ladderBars[0].scale.set(1, 1 + 2 * (1 - P1()), 1);
        ladderBars[1].scale.set(1, 1 + 2 * P1(), 1);
        // 微波
        const arr = mwGeo.attributes.position.array;
        for (let i = 0; i < mwN; i++) { const x = -4.9 + 4.6 * i / (mwN - 1); arr[i * 3] = x; arr[i * 3 + 1] = -2.2 + ladderY[1] / 2 + 0.35 * Math.sin(x * 9 - T * 14); arr[i * 3 + 2] = 0; }
        mwGeo.attributes.position.needsUpdate = true;
        mw.material.opacity = anim ? 1 : 0;
        const pv = $("r4p"); if (pv) { pv.textContent = P1().toFixed(3); $("r4bar").style.width = (P1() * 100).toFixed(1) + "%"; }
      }
      const p5 = $("r5p"); if (p5 && cur === 4) p5.textContent = P1().toFixed(3);
    }

    // 標籤投影
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const t of tags) {
      let show = t.chapters.includes(cur) && (cur !== 0 || showTags);
      if (show) {
        tmpV.copy(t.pos).project(camera);
        show = tmpV.z < 1 && Math.abs(tmpV.x) < 1.05 && Math.abs(tmpV.y) < 1.05;
        if (show) t.el.style.transform = `translate(${((tmpV.x + 1) / 2 * w).toFixed(1)}px, ${((1 - tmpV.y) / 2 * h).toFixed(1)}px) ${t.el.classList.contains("flat") ? "translate(-50%, -50%)" : "translate(-50%, calc(-100% - 8px))"}`;
      }
      t.el.style.opacity = show ? 1 : 0;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- 啟動 ----------
  const fromHash = () => { const id = location.hash.slice(1); const i = CH.findIndex(c => c.id === id); return i < 0 ? 0 : i; };
  window.addEventListener("hashchange", () => go(fromHash(), true));
  resize();
  go(fromHash(), true);
  desiredCamPos(camera.position); camTarget.copy(desired.target);
  requestAnimationFrame(frame);
})();
</script>

</body>
